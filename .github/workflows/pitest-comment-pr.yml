name: Mutation Testing - Post Result to PR

# Runs after the Mutation Testing workflow completes. Uses workflow_run so
# the GITHUB_TOKEN is scoped to the base repo and can write PR comments
# even when the PR comes from a fork.
on:
  workflow_run:
    workflows: [ Mutation Testing ]
    types: [ completed ]

permissions:
  actions: read
  checks: write
  pull-requests: write

env:
  MAVEN_ARGS: -B -V -ntp -e -Djansi.passthrough=true -Dstyle.color=always

jobs:

  post-to-pr:

    name: "Post to PR #${{ github.event.workflow_run.pull_requests[0].number }}"
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'zulu'
          java-version: '25'
          cache: 'maven'
      - name: Download Results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pitest
          path: target/pit-reports
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      # Must come before any Maven invocation rooted at the checkout: Maven loads the core
      # extensions listed in .mvn/extensions.xml before it reads pom.xml, resolving them from
      # settings.xml only, so the Maven Central snapshot repository serving mvn-lens cannot be
      # declared in pom.xml. Building .mvn/pom.xml downloads the extension into the local
      # repository, where every later invocation finds it. See .mvn/pom.xml.
      - name: Pre-resolve the mvn-lens extension
        working-directory: .mvn
        run: ../mvnw $MAVEN_ARGS -U dependency:resolve
      # mvn-lens is switched off here: this invocation only posts a comment, there is no build to profile.
      - name: Post Result to PR
        run: ./mvnw $MAVEN_ARGS -Dmvnlens.disabled=true pitest-github:github -DrepoToken=${{ secrets.GITHUB_TOKEN }}
