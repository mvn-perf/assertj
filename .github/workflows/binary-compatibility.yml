name: Binary Compatibility

on:
  push:
    branches: [ 'main', '3.x' ]
    paths: [ 'assertj-core/**' ]
  pull_request:
    branches: [ 'main', '3.x' ]
    paths: [ 'assertj-core/**' ]

permissions: {}

env:
  MAVEN_ARGS: -B -V -ntp -e -Djansi.passthrough=true -Dstyle.color=always -DskipTests

jobs:
  verify-with-base:
    name: Verify with target branch
    runs-on: ubuntu-latest
    if: github.base_ref != null

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'zulu'
          java-version: '25'
          cache: 'maven'
      # Must come before any Maven invocation rooted at the checkout: Maven loads the core
      # extensions listed in .mvn/extensions.xml before it reads pom.xml, resolving them from
      # settings.xml only, so the Maven Central snapshot repository serving mvn-lens cannot be
      # declared in pom.xml. Building .mvn/pom.xml downloads the extension into the local
      # repository, where every later invocation finds it. See .mvn/pom.xml.
      - name: Pre-resolve the mvn-lens extension
        working-directory: .mvn
        run: ../mvnw $MAVEN_ARGS -U dependency:resolve

      - name: Checkout `${{ github.base_ref }}` into subfolder
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.base_ref }}
          path: ${{ github.run_id }}.${{ github.base_ref }}
      - name: Build `${{ github.base_ref }}`
        run: ./mvnw $MAVEN_ARGS -f ${{ github.run_id }}.${{ github.base_ref }}/assertj-core/pom.xml package
      - name: Compare `${{ github.head_ref }}` with `${{ github.base_ref }}`
        run: >
          ./mvnw $MAVEN_ARGS -f assertj-core/pom.xml -Pjapicmp-branch package japicmp:cmp
          -Djapicmp.breakBuildOnBinaryIncompatibleModifications=true
          -Djapicmp.oldVersion.basedir=${{ github.run_id }}.${{ github.base_ref }}/assertj-core

      - name: Add result to job summary
        if: success() || failure()
        run: cat assertj-core/target/japicmp/default-cli.md >> $GITHUB_STEP_SUMMARY
      # The report of the `${{ github.head_ref }}` build: mvn-lens writes it under the
      # directory of the POM the build was rooted at (-f).
      - name: Archive the mvn-lens build report
        if: success() || failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mvn-lens-binary-compatibility-base
          path: assertj-core/target/mvnlens

  verify-with-release:

    name: Verify with latest release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'zulu'
          java-version: '25'
          cache: 'maven'
      - name: Pre-resolve the mvn-lens extension
        working-directory: .mvn
        run: ../mvnw $MAVEN_ARGS -U dependency:resolve

      - name: Compare with the latest release
        run: >
          ./mvnw $MAVEN_ARGS -f assertj-core/pom.xml package japicmp:cmp
          -Djapicmp.breakBuildOnBinaryIncompatibleModifications=true

      - name: Add result to job summary
        if: success() || failure()
        run: cat assertj-core/target/japicmp/default-cli.md >> $GITHUB_STEP_SUMMARY
      - name: Archive the mvn-lens build report
        if: success() || failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mvn-lens-binary-compatibility-release
          path: assertj-core/target/mvnlens
