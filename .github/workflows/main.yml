name: CI

on:
  push:
    branches: [ 'main', '3.x' ]
  pull_request:
    branches: [ 'main', '3.x' ]

permissions: {}

env:
  MAVEN_ARGS: -B -V -ntp -e -Djansi.passthrough=true -Dstyle.color=always

jobs:

  java:

    name: Java 25 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macOS-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      checks: write
      contents: write   # build-monitor/report commits the mvn-lens report to the inbox branch
      actions: read     # … and identifies its own job/step through the Jobs API

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'zulu'
          java-version: '25'
          cache: 'maven'
      - uses: testlens-app/setup-testlens@d29a2be31512b3aeda3adcef09fbe0d55af90c51 # v1.9.4
      # Must come before any Maven invocation rooted at the checkout: Maven loads the core
      # extensions listed in .mvn/extensions.xml before it reads pom.xml, resolving them from
      # settings.xml only, so the Maven Central snapshot repository serving mvn-lens cannot be
      # declared in pom.xml. Building .mvn/pom.xml downloads the extension into the local
      # repository, where every later invocation finds it. See .mvn/pom.xml.
      - name: Pre-resolve the mvn-lens extension
        working-directory: .mvn
        run: ../mvnw $MAVEN_ARGS -U dependency:resolve
      - name: Test
        run: ./mvnw $MAVEN_ARGS verify
      - name: Publish Test Report
        uses: mikepenz/action-junit-report@d9f48fc87bc235f7e214acf696ca5abc0a986f16 # v6.4.2
        if: success() || failure() # always run even if the previous step fails
        with:
          report_paths: '**/target/surefire-reports/TEST-*.xml'
      # mvn-lens writes the report when the Maven session ends, a failed one included,
      # which is exactly the build worth looking at. The report is committed to the
      # monitoring inbox branch (no artifact) and linked from the job summary.
      - name: Publish the mvn-lens build report
        if: ${{ !cancelled() }}
        uses: mvn-perf/build-monitor/report@job-summary-overview
        with:
          job-name: Java 25 (${{ matrix.os }})

  java-oracle:

    name: Java ${{ matrix.java }}
    strategy:
      fail-fast: false
      matrix:
        # https://jdk.java.net/
        java: [26, 27, 28, leyden, loom, valhalla]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # build-monitor/report commits the mvn-lens report to the inbox branch
      actions: read     # … and identifies its own job/step through the Jobs API

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java
        uses: oracle-actions/setup-java@fff43251af9936a0e6a4d5d0946e14f1680e9b6b # v1.5.0
        with:
          website: jdk.java.net
          release: ${{ matrix.java }}
          version: latest
      - uses: testlens-app/setup-testlens@d29a2be31512b3aeda3adcef09fbe0d55af90c51 # v1.9.4
      - name: Pre-resolve the mvn-lens extension
        working-directory: .mvn
        run: ../mvnw $MAVEN_ARGS -U dependency:resolve
      - name: Test
        run: ./mvnw $MAVEN_ARGS verify
      # Committed to the monitoring inbox branch (no artifact), see the java job.
      - name: Publish the mvn-lens build report
        if: ${{ !cancelled() }}
        uses: mvn-perf/build-monitor/report@job-summary-overview
        with:
          job-name: Java ${{ matrix.java }}

  groovy:

    name: Groovy ${{ matrix.groovy }}
    strategy:
      fail-fast: false
      matrix:
        # https://groovy.apache.org/download.html
        groovy: [4.0.32]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # build-monitor/report commits the mvn-lens report to the inbox branch
      actions: read     # … and identifies its own job/step through the Jobs API

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'zulu'
          java-version: '25'
          cache: 'maven'
      - uses: testlens-app/setup-testlens@d29a2be31512b3aeda3adcef09fbe0d55af90c51 # v1.9.4
      - name: Pre-resolve the mvn-lens extension
        working-directory: .mvn
        run: ../mvnw $MAVEN_ARGS -U dependency:resolve
      - name: Test
        run: ./mvnw $MAVEN_ARGS -pl assertj-tests/assertj-integration-tests/assertj-core-groovy -am -Dgroovy.version=${{ matrix.groovy }} verify
      # Committed to the monitoring inbox branch (no artifact), see the java job.
      - name: Publish the mvn-lens build report
        if: ${{ !cancelled() }}
        uses: mvn-perf/build-monitor/report@job-summary-overview
        with:
          job-name: Groovy ${{ matrix.groovy }}

  kotlin:

    name: Kotlin ${{ matrix.kotlin }}
    strategy:
      fail-fast: false
      matrix:
        # https://kotlinlang.org/docs/releases.html#release-details
        kotlin: [2.1.21, 2.2.21]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # build-monitor/report commits the mvn-lens report to the inbox branch
      actions: read     # … and identifies its own job/step through the Jobs API

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'zulu'
          java-version: '25'
          cache: 'maven'
      - uses: testlens-app/setup-testlens@d29a2be31512b3aeda3adcef09fbe0d55af90c51 # v1.9.4
      - name: Pre-resolve the mvn-lens extension
        working-directory: .mvn
        run: ../mvnw $MAVEN_ARGS -U dependency:resolve
      - name: Test
        run: ./mvnw $MAVEN_ARGS -pl assertj-tests/assertj-integration-tests/assertj-core-kotlin -am -Dkotlin.version=${{ matrix.kotlin }} verify
      # Committed to the monitoring inbox branch (no artifact), see the java job.
      - name: Publish the mvn-lens build report
        if: ${{ !cancelled() }}
        uses: mvn-perf/build-monitor/report@job-summary-overview
        with:
          job-name: Kotlin ${{ matrix.kotlin }}

  javadoc:

    name: Javadoc
    runs-on: ubuntu-latest
    permissions:
      contents: write   # build-monitor/report commits the mvn-lens report to the inbox branch
      actions: read     # … and identifies its own job/step through the Jobs API

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'zulu'
          java-version: '25'
          cache: 'maven'
      - name: Pre-resolve the mvn-lens extension
        working-directory: .mvn
        run: ../mvnw $MAVEN_ARGS -U dependency:resolve
      - name: Generate Javadoc
        run: ./mvnw $MAVEN_ARGS -DskipTests package javadoc:javadoc
      - name: Upload Javadoc
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: javadoc
          if-no-files-found: error
          path: |
            **/target/reports/apidocs
      # Committed to the monitoring inbox branch (no artifact), see the java job.
      - name: Publish the mvn-lens build report
        if: ${{ !cancelled() }}
        uses: mvn-perf/build-monitor/report@job-summary-overview
        with:
          job-name: Javadoc

  sonar:

    name: Sonar code analysis
    runs-on: ubuntu-latest
    if: github.repository_owner == 'assertj' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'zulu'
          java-version: '25'
          cache: 'maven'
      - uses: testlens-app/setup-testlens@d29a2be31512b3aeda3adcef09fbe0d55af90c51 # v1.9.4
      - name: Pre-resolve the mvn-lens extension
        working-directory: .mvn
        run: ../mvnw $MAVEN_ARGS -U dependency:resolve
      - name: Test with Sonar
        run: >
          ./mvnw $MAVEN_ARGS verify sonar:sonar
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.organization=assertj
          -Dsonar.projectKey=joel-costigliola_assertj-core
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - name: Archive the mvn-lens build report
        if: success() || failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mvn-lens-sonar
          path: target/mvnlens

  publish-snapshot:

    name: Publish Snapshot
    needs: [java, javadoc]
    runs-on: ubuntu-latest
    if: github.repository_owner == 'assertj' && github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Maven Central
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'zulu'
          java-version: '25'
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_TOKEN
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Pre-resolve the mvn-lens extension
        working-directory: .mvn
        run: ../mvnw $MAVEN_ARGS -U dependency:resolve
      - name: Publish to Maven Central
        run: ./mvnw $MAVEN_ARGS -DskipTests -Ppublish deploy
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      - name: Archive the mvn-lens build report
        if: success() || failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mvn-lens-publish-snapshot
          path: target/mvnlens

  monitoring:

    name: Build monitoring
    needs: [java, java-oracle, groovy, kotlin, javadoc]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read

    steps:
      - name: Link the monitoring page from the run summary
        uses: mvn-perf/build-monitor/summary@job-summary-overview
